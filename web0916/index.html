<!DOCTYPE html>
<html>
<head>


<title>資訊三乙 陳士鉉 九九乘法表</title>
<style>
    /* 每個儲存格的style樣式：方框 + 方框線寬度為1px + 方框線為實線 */
    td {
         border: 2px solid;
         border-radius: 10px;
    }

th, td {
  background-color: #3afafa;
  }
  </style>
<script>
    document.write("<h1>資訊三乙 陳士鉉 九九乘法表</h1>");
    document.write("<table align='center'>");
    for (let i = 1; i <= 9; i++) {
        document.write("<tr>");
        for (let j = 0; j <= i ; j++) {
            document.write("<td>");
            document.write(i + " * " + j + " = " + (    i * j) + "&nbsp;&nbsp;&nbsp;");
            document.write("</td>");
        }
        document.write("</tr>");
    }
    document.write("</table>");
</script>   
</head>

</body>
</html>
