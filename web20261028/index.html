<!DOCTYPE html>
<html>
<body>

<h1>資訊三乙 33050221 陳士鉉</h1>
<p><b>遊戲目標：</b>記住燈泡亮起的順序並依序點擊（每關都是全新的隨機順序）！</p>

<!-- 3 個燈泡圖片 -->
<img id="img1" src="pic/pic_bulboff.gif" width="80" height="150">
<img id="img2" src="pic/pic_bulboff.gif" width="80" height="150">
<img id="img3" src="pic/pic_bulboff.gif" width="80" height="150">

<p>
  <button type="button" onclick="press(1)">燈泡 1</button>
  <button type="button" onclick="press(2)">燈泡 2</button>
  <button type="button" onclick="press(3)">燈泡 3</button>
  <button type="button" onclick="startGame()">🚀 開始遊戲</button>
</p>

<h2>當前關卡：第 <span id="level">0</span> 關</h2>
<h2 id="msg" style="color: blue;">請點擊「開始遊戲」挑戰！</h2>

<script>
var currentLevel = 0;   // 目前關卡數
var sequence = [];       // 儲存當前關卡的全新順序
var playerStep = 0;      // 玩家目前按到第幾步
var isPlaying = false;   // 播放順序期間禁止點擊

// 開始新遊戲
function startGame() {
  currentLevel = 0;
  nextRound();
}

// 進入下一關
function nextRound() {
  currentLevel++;
  playerStep = 0;
  sequence = []; // 清空舊題目

  // 根據關卡數，重新產生一組全新的隨機順序
  for (var i = 0; i < currentLevel; i++) {
    sequence.push(Math.floor(Math.random() * 3) + 1);
  }

  document.getElementById('level').innerText = currentLevel;
  document.getElementById('msg').style.color = "blue";
  document.getElementById('msg').innerText = " 仔細看！記憶全新的亮燈順序...";
  isPlaying = true;
  
  // 延遲 0.6 秒開始示範順序
  setTimeout(function() {
    playSequence(0);
  }, 600);
}

// 播放燈泡亮起順序
function playSequence(index) {
  if (index < sequence.length) {
    var bulb = sequence[index];
    document.getElementById('img' + bulb).src = "pic/pic_bulbon.gif";
    
    setTimeout(function() {
      document.getElementById('img' + bulb).src = "pic/pic_bulboff.gif";
      setTimeout(function() { 
        playSequence(index + 1); 
      }, 250); // 燈滅到下一顆亮的時間
    }, 550); // 燈泡亮著的時間
  } else {
    isPlaying = false; // 播放結束，換玩家操作
    document.getElementById('msg').innerText = "換你了！請依序按下燈泡按鈕";
  }
}

// 玩家按鈕點擊判斷
function press(btn) {
  if (sequence.length == 0 || isPlaying) return; // 未開始或播放中不可按

  if (btn == sequence[playerStep]) {
    // 按對時讓該燈泡亮 0.2 秒（點擊視覺回饋）
    flashSingle(btn);
    playerStep++;

    // 整串順序全部按對 -> 進入下一關
    if (playerStep == sequence.length) {
      isPlaying = true;
      document.getElementById('msg').style.color = "green";
      document.getElementById('msg').innerText = "🎉 答對了！準備進入下一關...";
      
      // 1 秒後直接進入下一關產生全新題目
      setTimeout(nextRound, 1000);
    }
  } else {
    // 按錯 -> 遊戲結束
    document.getElementById('msg').style.color = "red";
    document.getElementById('msg').innerText = "❌ 按錯了！遊戲結束，你成功闖過 " + (currentLevel - 1) + " 關！";
    turnAllOff();
    sequence = [];
    currentLevel = 0;
  }
}

// 玩家點擊時的單顆燈泡點亮回饋
function flashSingle(num) {
  document.getElementById('img' + num).src = "pic/pic_bulbon.gif";
  setTimeout(function() {
    document.getElementById('img' + num).src = "pic/pic_bulboff.gif";
  }, 200);
}

// 將全部燈泡熄滅
function turnAllOff() {
  for (var i = 1; i <= 3; i++) {
    document.getElementById('img' + i).src = "pic/pic_bulboff.gif";
  }
}
</script>

</body>
</html>
